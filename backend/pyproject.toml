[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitup"
version = "0.1.0"
description = "Registro, planificación y progresión de entrenamiento"
requires-python = ">=3.11"
# El dominio y la persistencia siguen usando solo la biblioteca estandar.
# Estas tres son del adaptador HTTP, no del nucleo.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[project.scripts]
fitup = "fitup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitup = ["infrastructure/db/migrations/*.sql", "infrastructure/seed/data/*.json"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["fitup"]
branch = true

# ---------------------------------------------------------------------------
# Lint
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # El dominio está documentado en español; los nombres de dominio también.
    "RUF001", "RUF002", "RUF003",
    # `from datetime import date as Date` es deliberado: el dominio tiene
    # campos llamados `date` y el alias evita que la clase quede sombreada.
    "N812",
    # Las excepciones del dominio se nombran por lo que significan
    # (LoadUndeterminable), no por su sufijo técnico.
    "N818",
]

# `Depends(...)`/`Query(...)` en el valor por defecto ES el idioma de FastAPI:
# B008 es un falso positivo ahi, no un descuido.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header",
    "fastapi.Body", "fastapi.Path",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
